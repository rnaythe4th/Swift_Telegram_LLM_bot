# Railway config-as-code (https://docs.railway.com/reference/config-as-code)
#
# /ready returns 503 until the bot has restored state and taken the writer
# lock (§3.1), so a new
# deployment starts receiving traffic (and the old one stops) only when it is
# actually ready — zero-loss redeploys together with the webhook queue.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
