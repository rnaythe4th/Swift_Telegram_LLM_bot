# Railway config-as-code (https://docs.railway.com/reference/config-as-code)
#
# /ready can return 200 while the bot waits to take over the writer lock
# from the previous deployment. The webhook returns 503 during that handoff.
# DeepSeek Web requires the writer lock, durable state, and a ready worker.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
